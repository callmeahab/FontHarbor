name: Bug report
description: Report a reproducible Font Harbor problem
body:
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Include what you expected and the steps to reproduce.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: App, macOS and Xcode versions
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or logs
      description: Remove personal information and secrets before sharing.
